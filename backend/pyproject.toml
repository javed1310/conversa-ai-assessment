[project]
name = "ai-engagement-api"
version = "0.1.0"
description = "Configurable customer engagement assessment API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "phonenumbers>=9,<10",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.13,<5",
  "tiktoken>=0.9,<1",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "mypy==1.18.2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false
# Pin the pure-Python-compatible line before mypy's mandatory native librt
# dependency; this workstation blocks that DLL. Windows policy stays enabled.
no-binary-package = ["mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = ["integration: requires the actual local MongoDB; uses isolated disposable test databases"]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
